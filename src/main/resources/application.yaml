spring:
  application:
    name: youowe
  datasource:
    url: jdbc:postgresql://localhost:5432/youowe_db
    username: postgres
    password: '12345'
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      expiration: 86400000
springdoc:
  override-with-generic-response: false